services:
  minecraft:
    image: itzg/minecraft-server
    environment:
      EULA: true
      MEMORY: 8G
      TYPE: FABRIC
      VERSION: 26.2
      FABRIC_LAUNCHER_VERSION: 1.1.1
      FABRIC_LOADER_VERSION: 0.19.3
      UID: "${MINECRAFT_UID:?missing MINECRAFT_UID}"
      GID: "${MINECRAFT_GID:?missing MINECRAFT_GID}"
      SEED: 6378
      WHITELIST: |
        sargon2
        zerowidth
        ieyasu
        BadManJose
        pZilla486
        guantastic
        VioletCrime
        Ro_0s
        OceanLettuce7
      OPS: |
        sargon2
      MODRINTH_PROJECTS: |
        fabric-api
        fabric-language-kotlin
        lithium
        ferrite-core
        view-distance-fix:beta
        geyser:beta
        floodgate
        viafabric:alpha
        # datapack:cheaper-recovery-compass
        trade-picker
        ledger
        bluemap
      VIEW_DISTANCE: 16
      USE_MEOWICE_FLAGS: true
      MOTD: |
        §cFirelight Systems§r §aMinecraft§r
        §7Unwind and enjoy!§r
      DIFFICULTY: hard
      ICON: https://www.firelightsystems.com/logo/logo_512x512.png
      VANILLATWEAKS_SHARECODE: kvflFT
    ports:
      - "25565:25565/tcp"
      - "25565:25565/udp"
      - "19132:19132/tcp"
      - "19132:19132/udp"
      - "19133:19133/tcp"
      - "19133:19133/udp"
      - "127.0.0.1:8100:8100/tcp"
    volumes:
      - type: bind
        source: ${MINECRAFT_DATA_LOCATION:?missing MINECRAFT_DATA_LOCATION}
        target: /data
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  data: {}
